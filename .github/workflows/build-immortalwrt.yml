name: Build ImmortalWrt lyw

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 强制重新编译(即使上游无更新)
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '30 */2 * * *'

permissions:
  contents: write

concurrency:
  group: build-immortalwrt-cron
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  ARCHITECTURE: armv8

jobs:
  watch-upstream:
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      version: ${{ steps.check.outputs.version }}
      kmod_hash: ${{ steps.kmod.outputs.hash }}
    steps:
    - uses: actions/checkout@main

    - name: 自动检测 ImmortalWrt 最新稳定版本
      id: check
      run: |
        FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force_build || 'false' }}"

        # ---- 1. 从 GitHub tags API 获取最新稳定版 tag (如 v25.12.2) ----
        # ImmortalWrt 未使用 GitHub "latest release" 标记, /releases/latest 返回 404
        # 故改用 /tags 接口, 过滤掉 rc/beta/alpha 等预发布版本
        TAGS_JSON=$(curl -fsSL --connect-timeout 15 --max-time 30 \
          "https://api.github.com/repos/immortalwrt/immortalwrt/tags?per_page=20" 2>/dev/null || true)
        LATEST_TAG=$(echo "$TAGS_JSON" | sed -n 's/.*"name": *"v\([^"]*\)".*/\1/p' | \
          grep -v -E '(rc|beta|alpha|dev|pre)' | head -1)

        if [ -z "$LATEST_TAG" ]; then
          echo "::warning::无法获取 ImmortalWrt 最新版本, 本次跳过"
          echo "changed=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        VERSION="$LATEST_TAG"
        echo ">>> 检测到最新稳定版本: ImmortalWrt v${VERSION}"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

        # ---- 2. 获取该版本最新 commit SHA ----
        API_SHA=$(curl -fsSL --connect-timeout 15 --max-time 30 \
          "https://api.github.com/repos/immortalwrt/immortalwrt/commits/v${VERSION}?per_page=1" \
          | sed -n 's/.*"sha": *"\([0-9a-f]\{40\}\)".*/\1/p' | head -1 || true)

        if [ -z "$API_SHA" ]; then
          echo "::warning::无法获取 v${VERSION} 的 commit SHA, 本次跳过"
          echo "changed=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo ">>> 上游 commit SHA: ${API_SHA}"
        echo "upstream_sha=${API_SHA}" >> $GITHUB_OUTPUT

        # ---- 3. 对比 last-upstream-sha (格式: VERSION:SHA) 判断是否需要重编 ----
        LAST_RECORD=""
        if [ -f last-upstream-sha ]; then
          LAST_RECORD=$(cat last-upstream-sha)
        fi
        echo ">>> 上次编译记录: ${LAST_RECORD:-无}"
        echo "force_build=${FORCE}"

        # 拆分旧记录: VERSION:SHA 或 仅 SHA(兼容旧格式)
        LAST_VERSION=$(echo "$LAST_RECORD" | cut -d: -f1)
        LAST_SHA=$(echo "$LAST_RECORD" | cut -d: -f2)
        if [ "$LAST_SHA" = "$LAST_RECORD" ]; then
          # 旧格式只有 SHA, 视为版本不匹配, 触发重编
          LAST_VERSION=""
        fi

        if [ "$FORCE" = "true" ]; then
          echo ">>> 强制重编"
          echo "changed=true" >> $GITHUB_OUTPUT
        elif [ "$VERSION" != "$LAST_VERSION" ] || [ "$API_SHA" != "$LAST_SHA" ]; then
          echo ">>> 上游有更新 (版本: ${LAST_VERSION:-无} -> ${VERSION}, SHA: ${LAST_SHA:-无} -> ${API_SHA})"
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo ">>> 上游无变化, 无需重编"
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: 获取官方 kmod hash
      id: kmod
      run: |
        VERSION="${{ steps.check.outputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${{ needs.watch-upstream.outputs.version }}"
        fi
        if [ -z "$VERSION" ]; then
          echo "::warning::版本为空, 无法获取 kmod hash"
          echo "hash=" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo ">>> 为目标版本 v${VERSION} 获取官方 kmod hash"
        HASH=""
        for base in \
          "https://downloads.immortalwrt.org/releases/${VERSION}/targets/rockchip/armv8/kmods/" \
          "https://mirrors.cernet.edu.cn/immortalwrt/releases/${VERSION}/targets/rockchip/armv8/kmods/" \
          "https://mirrors.ustc.edu.cn/immortalwrt/releases/${VERSION}/targets/rockchip/armv8/kmods/" ; do
          http_value=$(curl -fsSL --connect-timeout 15 --max-time 30 "$base" 2>/dev/null || true)
          HASH=$(echo "$http_value" | sed -n 's/.*-\([0-9a-f]\{32\}\)\/*.*/\1/p' | head -1)
          if [ -n "$HASH" ] && echo "$HASH" | grep -qE '^[0-9a-f]{32}$'; then
            echo ">>> 从 $base 抓到 kmod hash = $HASH"
            break
          fi
          HASH=""
        done
        if [ -n "$HASH" ]; then
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo ">>> kmod hash = ${HASH}"
        else
          echo "::warning::所有镜像源均未抓到 kmod hash, 将留给 diy-part1.sh 自行兜底"
          echo "hash=" >> $GITHUB_OUTPUT
        fi

  build:
    needs: watch-upstream
    if: needs.watch-upstream.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    env:
      REPO_BRANCH: v${{ needs.watch-upstream.outputs.version }}
    steps:
    - name: 准备完成
      uses: actions/checkout@main

    - name: 显示编译目标版本
      run: echo ">>> 编译 ImmortalWrt ${{ env.REPO_BRANCH }}"

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "------------------------------- 更新并安装依赖 -------------------------------"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/ubuntu-22.04) || true
        sudo -E apt-get -qq install -y python3-pip >/dev/null 2>&1 || true
        sudo pip3 install pyelftools || true
        echo "------------------------------- 清理Docker镜像和软件 -------------------------------"
        docker rmi `docker images -q` || true
        docker image prune -a -f || true
        sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
        sudo -E apt-get -qq autoremove --purge || true
        echo "------------------------------- 设置工作目录及时区 -------------------------------"
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存构建动作
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ubuntu-22.04-${{ env.ARCHITECTURE }}-${{ env.REPO_BRANCH }}
        prefix: ${{ github.workspace }}/openwrt

    - name: 加载自定义 feeds+DIY1
      env:
        FEEDS_CONF_PATH: ${{ env.ARCHITECTURE }}/${{ env.FEEDS_CONF }}
        UPSTREAM_KMOD_HASH: ${{ needs.watch-upstream.outputs.kmod_hash }}
      run: |
        echo ">>> workflow 传递 kmod hash: ${UPSTREAM_KMOD_HASH:-空(留给脚本自取)}"
        [ -e $FEEDS_CONF_PATH ] && mv $FEEDS_CONF_PATH openwrt/$FEEDS_CONF
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置+DIY2
      env:
        CONFIG_FILE_PATH: ${{ env.ARCHITECTURE }}/${{ env.CONFIG_FILE }}
      run: |
        [ -e $CONFIG_FILE_PATH ] && mv $CONFIG_FILE_PATH openwrt/$CONFIG_FILE
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        set -o pipefail
        make -j$(nproc) V=s 2>&1 | tee "$GITHUB_WORKSPACE/world-build.log" || {
          echo "===> main build FAILED; verbose single-thread retry"
          make -j1 V=s 2>&1 | tail -150
          echo "===> targeted re-run of target/linux/install V=s"
          make V=s target/linux/install 2>&1 | tail -300
          echo "===> read-only precondition checks"
          ls -l build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/image-rk3568-lyt-t68m.dtb 2>&1
          ls -l staging_dir/image/easepi-rk3568-u-boot-rockchip.bin 2>&1
          ls -l target/linux/rockchip/image/armv8/rk3568.bootscript 2>&1
          echo "===> last 120 lines of world build log"
          tail -120 "$GITHUB_WORKSPACE/world-build.log"
          exit 1
        }
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传编译日志
      uses: actions/upload-artifact@main
      if: always() && hashFiles('world-build.log') != ''
      with:
        name: world-build-log
        path: world-build.log

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 文件夹
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        # 隐私处理：设备名 lyt_t68m -> lyt_lyw
        for f in immortalwrt-*-lyt_t68m-*; do
          [ -e "$f" ] || continue
          nf=$(echo "$f" | sed 's/lyt_t68m/lyt_lyw/')
          mv "$f" "$nf"
        done
        sed -i 's/lyt_t68m/lyt_lyw/g' sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 发布 Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.REPO_BRANCH }}-${{ env.FILE_DATE }}-${{ github.sha }}
        name: ImmortalWrt ${{ env.REPO_BRANCH }} 固件 ${{ env.FILE_DATE }}
        body: |
          images 与 sha256sums 见本 Release assets。
        files: |
          openwrt/bin/targets/*/*/immortalwrt-*
          openwrt/bin/targets/*/*/sha256sums
        fail_on_unmatched_files: true

    - name: 记录已编译上游版本
      if: success()
      env:
        UPSTREAM_VERSION: ${{ needs.watch-upstream.outputs.version }}
        UPSTREAM_SHA: ${{ needs.watch-upstream.outputs.upstream_sha }}
        UPSTREAM_KMOD_HASH: ${{ needs.watch-upstream.outputs.kmod_hash }}
      run: |
        cd "$GITHUB_WORKSPACE"
        git config user.name "immwrt-build-bot"
        git config user.email "immwrt-build-bot@users.noreply.github.com"

        # 1. 更新 last-upstream-sha
        echo "${UPSTREAM_VERSION}:${UPSTREAM_SHA}" > last-upstream-sha
        git add -- last-upstream-sha

        # 2. 自动同步硬编码兜底 hash 为最新值（第2层兜底无需手动维护）
        if [ -n "$UPSTREAM_KMOD_HASH" ] && echo "$UPSTREAM_KMOD_HASH" | grep -qE '^[0-9a-f]{32}$'; then
          CUR_HASH=$(sed -n 's/^OFFICIAL_KMOD_HASH="\([0-9a-f]\{32\}\)"/\1/p' diy-part1.sh)
          if [ -n "$CUR_HASH" ] && [ "$CUR_HASH" != "$UPSTREAM_KMOD_HASH" ]; then
            sed -i "s/^OFFICIAL_KMOD_HASH=\"${CUR_HASH}\"/OFFICIAL_KMOD_HASH=\"${UPSTREAM_KMOD_HASH}\"/" diy-part1.sh
            git add -- diy-part1.sh
            echo ">>> 硬编码兜底 hash 已自动更新: ${CUR_HASH} -> ${UPSTREAM_KMOD_HASH}"
          else
            echo ">>> 硬编码兜底 hash 已是当前值, 无需更新"
          fi
        else
          echo "::warning::workflow 未抓到 kmod hash, 硬编码兜底保持不变"
        fi

        if git diff --cached --quiet; then
          echo "无变化，跳过提交"
        else
          git commit -m "build: record upstream v${UPSTREAM_VERSION} ${UPSTREAM_SHA} (kmod hash ${UPSTREAM_KMOD_HASH})"
          git push origin "${{ github.ref_name }}" || echo "push 失败(可忽略)"
        fi
